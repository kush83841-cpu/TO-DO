<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>✏️ Edit task — ToDo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <script>
        // Apply the saved theme before the page paints (no flash)
        try {
            var saved = localStorage.getItem("todo-theme");
            if (saved === "light" || saved === "dark") {
                document.documentElement.setAttribute("data-theme", saved);
            }
        } catch (e) { }
    </script>
</head>

<body>
    <div class="bg-glow"></div>

    <main class="wrap">
        <header class="hero">
            <div>
                <h1>✏️ Edit task</h1>
                <p class="tagline">Fix the title, date or time — then save.</p>
            </div>
            <div class="header-actions">
                <div class="menu-wrap">
                    <button class="menu-btn" id="menuBtn" type="button" title="More options">⋮</button>
                    <div class="menu-dropdown" id="menuDropdown">
                        <a href="{{ url_for('index') }}">✅ All Tasks</a>
                        <a href="{{ url_for('history') }}">📜 History</a>
                        <a href="{{ url_for('due') }}">⏰ Due Tasks{% if due_count %} ({{ due_count }}){% endif %}</a>
                    </div>
                </div>
                <button class="theme-btn" id="themeBtn" type="button" title="Switch theme">🌙</button>
            </div>
        </header>

        <form class="add-form card" action="{{ url_for('edit_task', task_id=t.id) }}" method="post">
            <input type="hidden" name="next" value="{{ back }}" />
            <input type="text" name="title" value="{{ t.title }}" required autofocus />
            <input type="date" id="dueDate" name="due_date" value="{{ t.due_date }}" title="Due date" />
            <input type="time" id="dueTime" name="due_time" value="{{ t.due_time }}" title="Due time" />
            <button type="submit">💾 Save changes</button>
            <a class="cancel-link" href="{{ back }}">Cancel</a>
        </form>

        <p class="back-link"><a href="{{ url_for('index') }}">← Back to tasks</a></p>

        <footer>
            <p>Made with 💜 while learning Flask</p>
        </footer>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
